[package]
name = "xdg-desktop-portal-phosh"
version = "0.50.0"
edition = "2021"

[dependencies.adw]
features = ["v1_5"]
package = "libadwaita"
version = "0.8"

[dependencies.ashpd]
features = ["backend", "gtk4"]
git = "https://github.com/arun-mani-j/ashpd.git"
rev = "5f108eb8acb4cecd3c71324445c64cf7f0292fbb"

[dependencies.PhoshFileSelector]
path = "subprojects/pfs"

[dependencies.gettextrs]
features = ["gettext-system"]
package = "gettext-rs"
version = "0.7"

[dependencies.gtk]
features = ["v4_18"]
package = "gtk4"
version = "0.10"

[dependencies.tokio]
features = ["rt-multi-thread"]
package = "tokio"
version = "1.46"

[dependencies.url]
version = "2.5"
