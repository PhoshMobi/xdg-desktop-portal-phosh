[package]
name = "xdg-desktop-portal-phosh"
edition = "2021"

[dependencies.adw]
features = ["v1_5"]
package = "libadwaita"
version = "0.9"

[dependencies.ashpd]
features = ["account", "backend", "file_chooser", "gtk4", "wallpaper"]
version = "0.13"

[dependencies.PhoshFileSelector]
path = "subprojects/pfs"

[dependencies.gettextrs]
features = ["gettext-system"]
package = "gettext-rs"
version = "0.7"

[dependencies.gio-unix]
version = "0.22"

[dependencies.gtk]
features = ["v4_20"]
package = "gtk4"
version = "0.11"

[dependencies.tokio]
features = ["rt-multi-thread"]
package = "tokio"
version = "1.46"
